<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Countdown app icon</title>
  <!-- Warm-black tile + hairline, matching the timer card (#161310 / #26FFFFFF). -->
  <rect x="26" y="26" width="972" height="972" rx="224" fill="#161310"/>
  <rect x="40" y="40" width="944" height="944" rx="210"
        fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="7"/>

  <!-- Faint track ring, then the cream elapsed arc notched at 12 o'clock. -->
  <circle cx="512" cy="520" r="300" fill="none"
          stroke="rgba(243,233,220,0.15)" stroke-width="56"/>
  <path d="M 643.5 250.4 A 300 300 0 1 1 380.5 250.4"
        fill="none" stroke="#F3E9DC" stroke-width="76"
        stroke-linecap="round"/>

  <!-- Clock hands in the canonical 10:10 layout (open ^ reads as a clock). -->
  <line x1="512" y1="520" x2="676.5" y2="425"
        stroke="#F3E9DC" stroke-width="30" stroke-linecap="round"/>
  <line x1="512" y1="520" x2="389" y2="449"
        stroke="#F3E9DC" stroke-width="42" stroke-linecap="round"/>
  <circle cx="512" cy="520" r="34" fill="#F3E9DC"/>

  <!-- Red tip: countdown about to close (brighter take on the #8C1D1D finish red). -->
  <circle cx="380.5" cy="250.4" r="42" fill="#E05046"/>
</svg>
